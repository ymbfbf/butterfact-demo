<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/butterfact-demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="butterfact_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>butterfact_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="err" style="display:none;position:fixed;top:0;left:0;right:0;padding:16px;background:#900;color:#fff;font:14px monospace;z-index:9999"></div>
  <script>
    var _firstErr = null;
    var _errCount = 0;
    function _showErr(msg) {
      _errCount++;
      if (_firstErr == null) {
        _firstErr = msg;
        var d = document.getElementById('err');
        d.style.display = 'block';
        d.textContent = msg;
      } else {
        document.getElementById('err').textContent = _firstErr + '\n(+' + (_errCount-1) + ' more errors)';
      }
    }
    window.onerror = function(msg, src, line, col, err) {
      var stack = err && err.stack ? '\n' + err.stack.split('\n').slice(0,6).join('\n') : '';
      _showErr(msg + '\n' + src + ':' + line + stack);
    };
    window.addEventListener('unhandledrejection', function(e) {
      var r = e.reason;
      _showErr('PROMISE REJECTED: ' + (r && (r.message || String(r))));
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
